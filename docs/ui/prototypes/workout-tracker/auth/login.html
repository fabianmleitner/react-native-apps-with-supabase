<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workout Tracker - Login</title>
  <style>
    body { margin: 0; font-family: Inter, Arial, sans-serif; background: #f7f4ee; color: #171a1f; }
    main { min-height: 100vh; padding: 28px 22px; display: grid; align-content: center; gap: 24px; }
    h1 { margin: 0; font-size: 34px; }
    p { color: #555b63; }
    form { display: grid; gap: 14px; }
    .field { display: grid; gap: 7px; }
    label { font-weight: 700; }
    input { border: 1px solid #d4cec2; border-radius: 8px; padding: 14px; font-size: 16px; background: white; }
    button, a.button { border: 0; border-radius: 8px; padding: 16px; font-weight: 800; text-align: center; text-decoration: none; }
    .primary { background: #171a1f; color: white; }
    .secondary { background: #e6e1d7; color: #171a1f; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Welcome back</h1>
      <p>Continue your plan and review today's training focus.</p>
    </header>
    <form>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="alex@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Password">
      </div>
      <button class="primary" type="submit">Log in</button>
      <a class="button secondary" href="registration.html">Create account</a>
    </form>
  </main>
</body>
</html>
