<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workout Tracker - Getting Started</title>
  <style>
    body { margin: 0; font-family: Inter, Arial, sans-serif; background: #f7f4ee; color: #171a1f; }
    .screen { min-height: 100vh; padding: 32px 22px; display: flex; flex-direction: column; justify-content: space-between; }
    .hero { display: grid; gap: 18px; }
    .badge { width: max-content; padding: 7px 11px; border-radius: 999px; background: #d8f36a; font-weight: 700; }
    h1 { font-size: 44px; line-height: 1; margin: 0; }
    p { font-size: 17px; line-height: 1.45; color: #555b63; }
    .benefit-card { padding: 16px; border-radius: 8px; background: #ffffff; box-shadow: 0 8px 22px rgba(0,0,0,.08); }
    .actions { display: grid; gap: 12px; }
    button, a.button { border: 0; border-radius: 8px; padding: 16px; font-weight: 800; text-align: center; text-decoration: none; }
    .primary { background: #171a1f; color: white; }
    .secondary { background: #e6e1d7; color: #171a1f; }
  </style>
</head>
<body>
  <main class="screen" data-agent-id="org-main-001">
    <section class="hero" data-agent-id="org-section-001">
      <span class="badge" data-agent-id="atm-text-001">Workout Tracker</span>
      <h1 data-agent-id="atm-text-002">Train smarter every week.</h1>
      <p data-agent-id="atm-text-003">Plan focused sessions, track effort, and keep your routine visible from the first screen.</p>
      <article class="benefit-card" data-agent-id="mol-card-001">
        <h2 data-agent-id="atm-text-004">Today at a glance</h2>
        <p data-agent-id="atm-text-005">Strength, mobility, and recovery stats stay grouped for quick decisions.</p>
      </article>
    </section>
    <section class="actions" data-agent-id="org-section-002">
      <a class="button primary" href="registration.html" data-agent-id="atm-link-001">Create account</a>
      <a class="button secondary" href="login.html" data-agent-id="atm-link-002">Log in</a>
    </section>
  </main>
</body>
</html>
